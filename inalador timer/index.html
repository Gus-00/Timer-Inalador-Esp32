<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer para Inalação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #f0f4f8;
    --surface:   #ffffff;
    --surface2:  #eaf1f8;
    --border:    #cddaec;
    --accent:    #2a7fc1;
    --accent2:   #4ab8a0;
    --warn:      #e07b20;
    --danger:    #d94f4f;
    --text:      #1e3048;
    --muted:     #6b87a4;
    --radius:    14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  header {
    width: 100%;
    max-width: 520px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2.5rem;
  }
  .logo {
    font-family: 'Nunito', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
  }
  .logo span { color: var(--muted); font-weight: 400; }

  #badge {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 5px 13px;
    border-radius: 99px;
    border: 1.5px solid;
    transition: all .3s;
    font-family: 'Nunito', sans-serif;
  }
  #badge.idle      { color: var(--muted);   border-color: var(--border);  background: var(--surface2); }
  #badge.running   { color: var(--accent);  border-color: var(--accent);  background: rgba(42,127,193,.09); }
  #badge.finished  { color: var(--accent2); border-color: var(--accent2); background: rgba(74,184,160,.09); }
  #badge.error     { color: var(--danger);  border-color: var(--danger);  background: rgba(217,79,79,.08); }
  #badge.offline   { color: var(--warn);    border-color: var(--warn);    background: rgba(224,123,32,.08); }
  #badge.connected { color: var(--accent2); border-color: var(--accent2); background: rgba(74,184,160,.09); }

  .card {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.8rem 2rem;
    margin-bottom: 1.1rem;
    box-shadow: 0 2px 8px rgba(42,100,160,.06);
  }
  .card-title {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.13em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 1.2rem;
  }

  .timer-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0.8rem 0 1.4rem;
  }
  .ring-svg { width: 200px; height: 200px; }
  .ring-bg  { fill: none; stroke: var(--surface2); stroke-width: 10; }
  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 439.8;
    stroke-dashoffset: 439.8;
    transform-origin: center;
    transform: rotate(-90deg);
    transition: stroke-dashoffset 0.9s linear, stroke 0.3s;
  }
  .ring-text-main {
    font-family: 'Source Code Pro', monospace;
    font-size: 2.4rem;
    font-weight: 600;
    fill: var(--text);
    text-anchor: middle;
    dominant-baseline: central;
  }
  .ring-text-sub {
    font-family: 'Nunito', sans-serif;
    font-size: 0.8rem;
    fill: var(--muted);
    text-anchor: middle;
    dominant-baseline: central;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 1.3rem;
  }
  .slider-label { font-size: 0.82rem; color: var(--muted); white-space: nowrap; font-weight: 500; }
  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: var(--surface2);
    border-radius: 99px;
    outline: none;
    border: 1px solid var(--border);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    transition: transform .15s;
    box-shadow: 0 1px 4px rgba(42,127,193,.3);
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
  .slider-val {
    font-family: 'Source Code Pro', monospace;
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--accent);
    min-width: 52px;
    text-align: right;
  }

  .presets {
    display: flex;
    gap: 7px;
    margin-bottom: 1.6rem;
    flex-wrap: wrap;
  }
  .preset-btn {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 6px 13px;
    border-radius: 99px;
    cursor: pointer;
    transition: all .2s;
    font-family: 'Nunito', sans-serif;
  }
  .preset-btn:hover, .preset-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(42,127,193,.08);
  }

  .btn-row { display: flex; gap: 10px; }
  .btn {
    flex: 1;
    padding: 13px;
    border-radius: var(--radius);
    border: none;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: 0.01em;
  }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn-start {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(42,127,193,.25);
  }
  .btn-start:not(:disabled):hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn-stop {
    background: #fff5f5;
    border: 1.5px solid var(--danger);
    color: var(--danger);
  }
  .btn-stop:not(:disabled):hover { background: rgba(217,79,79,.08); }

  .ip-row { display: flex; gap: 8px; align-items: center; }
  .ip-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Source Code Pro', monospace;
    font-size: 0.86rem;
    padding: 10px 14px;
    outline: none;
    transition: border-color .2s;
  }
  .ip-input:focus { border-color: var(--accent); }
  .btn-connect {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    transition: all .2s;
    white-space: nowrap;
  }
  .btn-connect:hover { border-color: var(--accent); color: var(--accent); background: rgba(42,127,193,.06); }

  #log {
    font-family: 'Source Code Pro', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.75;
    max-height: 120px;
    overflow-y: auto;
    padding-top: 0.4rem;
  }
  #log .ts   { color: var(--accent2); }
  #log .ok   { color: #2a9e7a; }
  #log .err  { color: var(--danger); }
  #log .warn { color: var(--warn); }

  #log::-webkit-scrollbar { width: 4px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

  @keyframes pulse-ring {
    0%,100% { filter: drop-shadow(0 0 3px rgba(42,127,193,.25)); }
    50%      { filter: drop-shadow(0 0 10px rgba(42,127,193,.55)); }
  }
  .running .ring-progress { animation: pulse-ring 2s ease-in-out infinite; }

  footer {
    margin-top: 1.5rem;
    font-size: 0.68rem;
    color: var(--muted);
    font-family: 'Source Code Pro', monospace;
    letter-spacing: 0.05em;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <div class="logo">AERO<span>TIMER</span></div>
  <div id="badge" class="offline">OFFLINE</div>
</header>

<div class="card">
  <div class="card-title">Conexão ESP32</div>
  <div class="ip-row">
    <input class="ip-input" id="ipInput" type="text" placeholder="192.168.x.x" value="192.168.1.100">
    <button class="btn-connect" id="btnConnect" onclick="toggleConnect()">Conectar</button>
  </div>
</div>

<div class="card" id="timerCard">
  <div class="card-title">Sessão de Inalação</div>

  <div class="timer-wrap" id="ringWrap">
    <svg class="ring-svg" viewBox="0 0 160 160">
      <circle class="ring-bg" cx="80" cy="80" r="70"/>
      <circle class="ring-progress" id="ringProgress" cx="80" cy="80" r="70"/>
      <text class="ring-text-main" id="ringTime" x="80" y="74">--:--</text>
      <text class="ring-text-sub" id="ringLabel" x="80" y="100">aguardando</text>
    </svg>
  </div>

  <div class="slider-row">
    <span class="slider-label">Duração</span>
    <input type="range" id="durSlider" min="60" max="1800" step="60" value="60" oninput="onSlider(this.value)">
    <span class="slider-val" id="durVal">1 min</span>
  </div>

  <div class="presets">
    <button class="preset-btn active" onclick="setDur(60)">1 min</button>
    <button class="preset-btn" onclick="setDur(300)">5 min</button>
    <button class="preset-btn" onclick="setDur(600)">10 min</button>
    <button class="preset-btn" onclick="setDur(900)">15 min</button>
    <button class="preset-btn" onclick="setDur(1200)">20 min</button>
    <button class="preset-btn" onclick="setDur(1800)">30 min</button>
  </div>

  <div class="btn-row">
    <button class="btn btn-start" id="btnStart" onclick="sendStart()" disabled>▶ Iniciar</button>
    <button class="btn btn-stop"  id="btnStop"  onclick="sendStop()"  disabled>■ Parar</button>
  </div>
</div>

<div class="card">
  <div class="card-title">Log do Sistema</div>
  <div id="log"><span class="ts">[--:--:--]</span> Aguardando conexão com o ESP32...</div>
</div>

<footer>ESP32 · WebSocket ws://IP:81 · AeroCtrl v1.0</footer>

<script>
let ws = null;
let connected = false;
let sessionDuration = 60;
let sessionRemaining = 0;
let sessionRunning = false;
let totalDuration = 60;

const CIRCUMFERENCE = 2 * Math.PI * 70;

function log(msg, type='') {
  const d = new Date();
  const ts = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.innerHTML = `<span class="ts">[${ts}]</span> <span class="${type}">${msg}</span>`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
  if (el.children.length > 40) el.removeChild(el.children[0]);
}

function setBadge(state) {
  const b = document.getElementById('badge');
  const labels = { idle:'IDLE', running:'EM USO', finished:'CONCLUÍDO', error:'ERRO', offline:'OFFLINE', connected:'CONECTADO' };
  b.className = '';
  b.classList.add(state);
  b.textContent = labels[state] || state.toUpperCase();
}

function fmtTime(s) {
  const m = Math.floor(s/60);
  const sec = s % 60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function fmtLabel(s) {
  if (s < 60) return `${s}s`;
  const m = s / 60;
  return Number.isInteger(m) ? `${m} min` : `${Math.floor(m)}m ${s%60}s`;
}

function updateRing(remaining, total, state) {
  const progress = document.getElementById('ringProgress');
  const timeEl   = document.getElementById('ringTime');
  const labelEl  = document.getElementById('ringLabel');
  const wrap     = document.getElementById('ringWrap');

  wrap.className = state === 'running' ? 'timer-wrap running' : 'timer-wrap';

  if (state === 'running') {
    const fraction = total > 0 ? remaining / total : 0;
    const offset = CIRCUMFERENCE * (1 - fraction);
    progress.style.strokeDasharray = CIRCUMFERENCE;
    progress.style.strokeDashoffset = offset;
    progress.style.stroke = remaining <= 30 ? 'var(--warn)' : 'var(--accent)';
    timeEl.textContent = fmtTime(remaining);
    labelEl.textContent = 'restante';
  } else if (state === 'finished') {
    progress.style.strokeDashoffset = CIRCUMFERENCE;
    progress.style.stroke = 'var(--accent2)';
    timeEl.textContent = '00:00';
    labelEl.textContent = 'concluído';
  } else {
    progress.style.strokeDashoffset = CIRCUMFERENCE;
    progress.style.stroke = 'var(--accent)';
    timeEl.textContent = '--:--';
    labelEl.textContent = 'aguardando';
  }
}

function updateButtons(state) {
  const start = document.getElementById('btnStart');
  const stop  = document.getElementById('btnStop');
  if (state === 'running') {
    start.disabled = true;
    stop.disabled  = false;
  } else if (connected) {
    start.disabled = false;
    stop.disabled  = true;
  } else {
    start.disabled = true;
    stop.disabled  = true;
  }
}

function onMessage(data) {
  try {
    const msg = JSON.parse(data);
    const { status, remaining, msg: errMsg } = msg;
    setBadge(status);
    sessionRunning = status === 'running';
    if (status === 'running') {
      sessionRemaining = remaining;
      if (totalDuration === 0 || totalDuration < remaining) totalDuration = sessionDuration;
      updateRing(remaining, totalDuration, 'running');
      updateButtons('running');
    } else if (status === 'finished') {
      updateRing(0, totalDuration, 'finished');
      updateButtons('idle');
      log('Sessão concluída com sucesso.', 'ok');
    } else if (status === 'idle') {
      updateRing(0, 0, 'idle');
      updateButtons('idle');
    } else if (status === 'error') {
      log(`Erro ESP32: ${errMsg || 'desconhecido'}`, 'err');
      updateButtons('idle');
    }
  } catch(e) {
    log('Resposta inválida do ESP32', 'err');
  }
}

function toggleConnect() {
  connected ? disconnect() : connect();
}

function connect() {
  const ip = document.getElementById('ipInput').value.trim();
  if (!ip) { log('Informe o IP do ESP32', 'err'); return; }
  const url = `ws://${ip}:81`;
  log(`Conectando em ${url}...`);
  document.getElementById('btnConnect').textContent = 'Aguarde...';
  try { ws = new WebSocket(url); } catch(e) {
    log(`Falha ao criar WebSocket: ${e.message}`, 'err'); return;
  }
  ws.onopen = () => {
    connected = true;
    log(`Conectado ao ESP32 (${ip})`, 'ok');
    setBadge('connected');
    document.getElementById('btnConnect').textContent = 'Desconectar';
    document.getElementById('btnStart').disabled = false;
    ws.send(JSON.stringify({ cmd: 'status' }));
  };
  ws.onmessage = (e) => onMessage(e.data);
  ws.onclose = () => {
    connected = false; sessionRunning = false;
    setBadge('offline'); updateRing(0,0,'idle'); updateButtons('disconnected');
    document.getElementById('btnConnect').textContent = 'Conectar';
    log('Conexão encerrada.', 'warn');
  };
  ws.onerror = () => {
    log('Erro de WebSocket. Verifique o IP e a rede.', 'err');
    document.getElementById('btnConnect').textContent = 'Conectar';
  };
}

function disconnect() { if (ws) ws.close(); }

function sendStart() {
  if (!connected || !ws) { log('Não conectado.', 'err'); return; }
  totalDuration = sessionDuration;
  ws.send(JSON.stringify({ cmd: 'start', duration: sessionDuration }));
  log(`Iniciando sessão de ${fmtLabel(sessionDuration)}...`);
}

function sendStop() {
  if (!connected || !ws) return;
  ws.send(JSON.stringify({ cmd: 'stop' }));
  log('Solicitação de parada enviada.', 'warn');
}

function onSlider(v) {
  sessionDuration = parseInt(v);
  document.getElementById('durVal').textContent = fmtLabel(sessionDuration);
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
}

function setDur(s) {
  sessionDuration = s;
  document.getElementById('durSlider').value = s;
  document.getElementById('durVal').textContent = fmtLabel(s);
  document.querySelectorAll('.preset-btn').forEach(b => {
    const map = {'1 min':60,'5 min':300,'10 min':600,'15 min':900,'20 min':1200,'30 min':1800};
    b.classList.toggle('active', map[b.textContent] === s);
  });
}
</script>
</body>
</html>
